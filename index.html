 --shell:#dcd9d1;--shell2:#c4c0b6;--btn:#a3214f;--btnSh:#5e1030;--btnOn:#8a1b43;--ink:#2b308f;

<script>
'use strict';
/* =========================================================
   NEUR POCKET — émulateur Game Boy (DMG)
   CPU LR35902, PPU, timer, APU 4 voies, MBC1/2/3/5
   Aucune ROM n'est fournie : charge la tienne.
   ========================================================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const img=ctx.createImageData(160,144);
const PALS=[
 ['#e0f8d0','#88c070','#346856','#081820'],['#c4cfa1','#8b956d','#4d533c','#1f1f1f'],
 ['#f4f0ff','#b0a8e0','#6058a0','#201838'],['#fff6d3','#f9a875','#eb6b6f','#7c3f58'],['#e8f7ff','#8cc8e8','#3c6ea8','#0c1a3a']];
let palI=0,pal=[];
function setPal(i){palI=i;pal=PALS[i].map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);try{localStorage.setItem('np_pal',i);}catch(e){}}
try{setPal(+localStorage.getItem('np_pal')||0);}catch(e){setPal(0);}

/* ---------- mémoire ---------- */
let rom=new Uint8Array(0x8000),eram=new Uint8Array(0x20000),vram=new Uint8Array(0x4000),wram=new Uint8Array(0x8000),oam=new Uint8Array(0xA0),io=new Uint8Array(0x80),hram=new Uint8Array(0x80);
let ramUsable=false,serial='';
// Game Boy Color
let cgb=false,dbl=false,vbank=0,wbank=1,hdmaOn=false,hdmaSrc=0,hdmaDst=0,hdmaLeft=0;
const bgPal=new Uint8Array(64),obPal=new Uint8Array(64);
let IE=0,IF=0,mbc=0,romBank=1,bankHi=0,ramBank=0,ramOn=false,mbcMode=0,romMask=1,ramMask=0,battery=false,title='',loaded=false,ramDirty=false;
let joyDir=0xF,joyBtn=0xF;
function romOff(){let b;
 if(mbc===1){b=(romBank&0x1F)|(bankHi<<5);}else b=romBank;
 return (b&romMask)*0x4000;}
function rb(a){
 if(a<0x4000){if(mbc===1&&mbcMode&&romMask>31)return rom[(((bankHi<<5)&romMask)*0x4000+a)%rom.length];return rom[a];}
 if(a<0x8000)return rom[(romOff()+a-0x4000)%rom.length];
 if(a<0xA000)return vram[vbank*0x2000+a-0x8000];
 if(a<0xC000){if(!ramOn||!ramUsable)return 0xFF;if(mbc===2)return eram[(a-0xA000)&0x1FF]|0xF0;return eram[((ramBank&ramMask)*0x2000+a-0xA000)];}
 if(a<0xD000)return wram[a-0xC000];
 if(a<0xE000)return wram[wbank*0x1000+a-0xD000];
 if(a<0xF000)return wram[a-0xE000];
 if(a<0xFE00)return wram[wbank*0x1000+a-0xF000];
 if(a<0xFEA0)return oam[a-0xFE00];
 if(a<0xFF00)return 0xFF;
 if(a<0xFF80)return ioRead(a);
 if(a<0xFFFF)return hram[a-0xFF80];
 return IE;
}
function wb(a,v){
 v&=0xFF;
 if(a<0x8000){mbcWrite(a,v);return;}
 if(a<0xA000){vram[vbank*0x2000+a-0x8000]=v;return;}
 if(a<0xC000){if(ramOn&&ramUsable){if(mbc===2)eram[(a-0xA000)&0x1FF]=v&0xF;else eram[(ramBank&ramMask)*0x2000+a-0xA000]=v;ramDirty=true;}return;}
 if(a<0xD000){wram[a-0xC000]=v;return;}
 if(a<0xE000){wram[wbank*0x1000+a-0xD000]=v;return;}
 if(a<0xF000){wram[a-0xE000]=v;return;}
 if(a<0xFE00){wram[wbank*0x1000+a-0xF000]=v;return;}
 if(a<0xFEA0){oam[a-0xFE00]=v;return;}
 if(a<0xFF00)return;
 if(a<0xFF80){ioWrite(a,v);return;}
 if(a<0xFFFF){hram[a-0xFF80]=v;return;}
 IE=v;
}
function hdmaBlock(){for(let i=0;i<16;i++){vram[vbank*0x2000+((hdmaDst+i)&0x1FFF)]=rb((hdmaSrc+i)&0xFFFF);}hdmaSrc=(hdmaSrc+16)&0xFFFF;hdmaDst=(hdmaDst+16)&0x1FF0;hdmaLeft--;if(hdmaLeft<=0){hdmaOn=false;}}
function mbcWrite(a,v){
 if(mbc===1){
  if(a<0x2000)ramOn=(v&0xF)===0xA;
  else if(a<0x4000){romBank=v&0x1F;if(romBank===0)romBank=1;}
  else if(a<0x6000){bankHi=v&3;ramBank=mbcMode?bankHi:0;}
  else{mbcMode=v&1;ramBank=mbcMode?bankHi:0;}
 }else if(mbc===2){
  if(a<0x4000){if(a&0x100){romBank=v&0xF;if(!romBank)romBank=1;}else ramOn=(v&0xF)===0xA;}
 }else if(mbc===3){
  if(a<0x2000)ramOn=(v&0xF)===0xA;
  else if(a<0x4000){romBank=v&0x7F;if(!romBank)romBank=1;}
  else if(a<0x6000){ramBank=v&3;}
 }else if(mbc===5){
  if(a<0x2000)ramOn=(v&0xF)===0xA;
  else if(a<0x3000)romBank=(romBank&0x100)|v;
  else if(a<0x4000)romBank=(romBank&0xFF)|((v&1)<<8);
  else if(a<0x6000)ramBank=v&0xF;
 }
}
function ioRead(a){
 const r=a&0x7F;
 switch(r){
  case 0x00:{const s=io[0]&0x30;let lo=0xF;if(!(s&0x10))lo&=joyDir;if(!(s&0x20))lo&=joyBtn;return 0xC0|s|lo;}
  case 0x04:return(divC>>8)&0xFF;
  case 0x0F:return IF|0xE0;
  case 0x41:return 0x80|(io[0x41]&0x78)|(LY===io[0x45]?4:0)|(io[0x40]&0x80?mode:0);
  case 0x44:return lyRead();
  case 0x26:return(io[0x26]&0x80)|0x70|(ch1.en?1:0)|(ch2.en?2:0)|(ch3.en?4:0)|(ch4.en?8:0);
  case 0x4D:return cgb?(dbl?0x80:0)|(io[0x4D]&1)|0x7E:0xFF;
  case 0x4F:return cgb?0xFE|vbank:0xFF;
  case 0x55:return cgb?(hdmaOn?((hdmaLeft-1)&0x7F):0xFF):0xFF;
  case 0x69:return cgb?bgPal[io[0x68]&0x3F]:0xFF;
  case 0x6B:return cgb?obPal[io[0x6A]&0x3F]:0xFF;
  case 0x70:return cgb?0xF8|wbank:0xFF;
 }
 if(r>=0x10&&r<0x30)return io[r]|APU_OR[r-0x10];

function sweepCalc(){let n=ch1.shadow>>ch1.swSh;n=ch1.swNeg?ch1.shadow-n:ch1.shadow+n;if(n>2047)ch1.en=false;return n;}
function trigSq(c,isOne){
 c.en=c.dac;if(c.len===0)c.len=64;c.timer=(2048-c.freq)*4;c.vol=c.iv;c.envT=c.envP||8;
 if(isOne){c.shadow=c.freq;c.swT=c.swP||8;c.swEn=c.swP>0||c.swSh>0;if(c.swSh)sweepCalc();}
}
function apuWrite(r,v){
 if(r>=0x30){io[r]=v;return;}
 if(r!==0x26&&!(io[0x26]&0x80))return;
 io[r]=v;
 switch(r){
  case 0x10:ch1.swP=(v>>4)&7;ch1.swNeg=!!(v&8);ch1.swSh=v&7;break;
  case 0x11:ch1.duty=v>>6;ch1.len=64-(v&63);break;
  case 0x12:ch1.iv=v>>4;ch1.envUp=!!(v&8);ch1.envP=v&7;ch1.dac=(v&0xF8)!==0;if(!ch1.dac)ch1.en=false;break;
  case 0x13:ch1.freq=(ch1.freq&0x700)|v;break;
  case 0x14:ch1.freq=(ch1.freq&0xFF)|((v&7)<<8);ch1.lenEn=!!(v&0x40);if(v&0x80)trigSq(ch1,true);break;
  case 0x16:ch2.duty=v>>6;ch2.len=64-(v&63);break;
  case 0x17:ch2.iv=v>>4;ch2.envUp=!!(v&8);ch2.envP=v&7;ch2.dac=(v&0xF8)!==0;if(!ch2.dac)ch2.en=false;break;
  case 0x18:ch2.freq=(ch2.freq&0x700)|v;break;
  case 0x19:ch2.freq=(ch2.freq&0xFF)|((v&7)<<8);ch2.lenEn=!!(v&0x40);if(v&0x80)trigSq(ch2,false);break;
  case 0x1A:ch3.dac=!!(v&0x80);if(!ch3.dac)ch3.en=false;break;
  case 0x1B:ch3.len=256-v;break;
  case 0x1C:ch3.vs=(v>>5)&3;break;
  case 0x1D:ch3.freq=(ch3.freq&0x700)|v;break;
  case 0x1E:ch3.freq=(ch3.freq&0xFF)|((v&7)<<8);ch3.lenEn=!!(v&0x40);if(v&0x80){ch3.en=ch3.dac;if(ch3.len===0)ch3.len=256;ch3.timer=(2048-ch3.freq)*2;ch3.pos=0;}break;
  case 0x20:ch4.len=64-(v&63);break;
  case 0x21:ch4.iv=v>>4;ch4.envUp=!!(v&8);ch4.envP=v&7;ch4.dac=(v&0xF8)!==0;if(!ch4.dac)ch4.en=false;break;
  case 0x22:ch4.per=NDIV[v&7]<<(v>>4);ch4.w7=!!(v&8);break;
  case 0x23:ch4.lenEn=!!(v&0x40);if(v&0x80){ch4.en=ch4.dac;if(ch4.len===0)ch4.len=64;ch4.timer=ch4.per;ch4.vol=ch4.iv;ch4.envT=ch4.envP||8;ch4.lfsr=0x7FFF;}break;
  case 0x26:if(!(v&0x80)){for(let i=0x10;i<0x26;i++)io[i]=0;ch1.en=ch2.en=ch3.en=ch4.en=false;}io[0x26]=v&0x80;break;
 }
}
function env(c){if(c.envP){if(--c.envT<=0){c.envT=c.envP;if(c.envUp&&c.vol<15)c.vol++;else if(!c.envUp&&c.vol>0)c.vol--;}}}
function lenTick(c){if(c.lenEn&&c.len>0){if(--c.len===0)c.en=false;}}
function frameSeq(){
 const s=fsStep;
 if(!(s&1)){lenTick(ch1);lenTick(ch2);lenTick(ch3);lenTick(ch4);}
 if(s===2||s===6){if(ch1.swEn&&--ch1.swT<=0){ch1.swT=ch1.swP||8;if(ch1.swP){const n=sweepCalc();if(n<=2047&&ch1.swSh){ch1.shadow=n;ch1.freq=n;sweepCalc();}}}}
 if(s===7){env(ch1);env(ch2);env(ch4);}
 fsStep=(s+1)&7;
}
function tickAPU(c){
 if(!(io[0x26]&0x80)){smpT+=c;while(smpT>=CPS){smpT-=CPS;pushSample(0);}return;}
 fsT+=c;while(fsT>=8192){fsT-=8192;frameSeq();}
 ch1.timer-=c;if(ch1.timer<=0){const p=(2048-ch1.freq)*4;do{ch1.timer+=p;ch1.pos=(ch1.pos+1)&7;}while(ch1.timer<=0);}
 ch2.timer-=c;if(ch2.timer<=0){const p=(2048-ch2.freq)*4;do{ch2.timer+=p;ch2.pos=(ch2.pos+1)&7;}while(ch2.timer<=0);}
 ch3.timer-=c;while(ch3.timer<=0){ch3.timer+=(2048-ch3.freq)*2;ch3.pos=(ch3.pos+1)&31;}
 ch4.timer-=c;while(ch4.timer<=0){ch4.timer+=ch4.per;const x=(ch4.lfsr&1)^((ch4.lfsr>>1)&1);ch4.lfsr=(ch4.lfsr>>1)|(x<<14);if(ch4.w7)ch4.lfsr=(ch4.lfsr&~0x40)|(x<<6);}
 smpT+=c;
 while(smpT>=CPS){smpT-=CPS;mix();}
}
function mix(){
 const o1=ch1.en&&ch1.dac?DUTY[ch1.duty][ch1.pos]*ch1.vol:0;
 const o2=ch2.en&&ch2.dac?DUTY[ch2.duty][ch2.pos]*ch2.vol:0;
 let o3=0;if(ch3.en&&ch3.dac&&ch3.vs){const b=io[0x30+(ch3.pos>>1)];const s=ch3.pos&1?b&0xF:b>>4;o3=s>>(ch3.vs-1);}
 const o4=ch4.en&&ch4.dac?((~ch4.lfsr)&1)*ch4.vol:0;
 const nr51=io[0x25],nr50=io[0x24];
 let l=0,r=0;
 if(nr51&0x10)l+=o1;if(nr51&0x20)l+=o2;if(nr51&0x40)l+=o3;if(nr51&0x80)l+=o4;
 if(nr51&1)r+=o1;if(nr51&2)r+=o2;if(nr51&4)r+=o3;if(nr51&8)r+=o4;
 l*=((nr50>>4)&7)+1;r*=(nr50&7)+1;
 const s=(l+r)/(2*4*15*8);
 pushSample(s);
}
function pushSample(s){const y=s-hpL+0.996*hpO;hpL=s;hpO=y;if(apos<abuf.length)abuf[apos++]=y*0.9;}

/* ---------- audio sortie ---------- */
let AC=null,nextT=0,sound=true;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();CPS=4194304/AC.sampleRate;abuf=new Float32Array(Math.ceil(AC.sampleRate/14));}catch(e){AC=null;}
}
function flushAudio(){
 const n=apos;apos=0;
 if(!AC||!sound||!n||AC.state!=='running')return;
 const now=AC.currentTime;
 if(nextT<now+0.02)nextT=now+0.06;
 if(nextT>now+0.3)return;
 const b=AC.createBuffer(1,n,AC.sampleRate);b.copyToChannel?b.copyToChannel(abuf.subarray(0,n),0):b.getChannelData(0).set(abuf.subarray(0,n));
 const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(nextT);nextT+=n/AC.sampleRate;
}

const info=document.getElementById('info'),led=document.getElementById('led');
function reset(){
 if(cgb){A=0x11;F=0x80;B=0;C=0;D=0xFF;E=0x56;H=0;L=0x0D;}else{A=0x01;F=0xB0;B=0;C=0x13;D=0;E=0xD8;H=0x01;L=0x4D;}SP=0xFFFE;PC=0x100;IME=0;eiP=0;halted=0;
 dbl=false;vbank=0;wbank=1;hdmaOn=false;hdmaLeft=0;bgPal.fill(0xFF);obPal.fill(0xFF);fbc.fill(0x7FFF);
 IE=0;IF=0xE1&0x1F;divC=0xABCC;timA=0;LY=0;mode=2;ppuC=0;winLine=0;
 vram.fill(0);wram.fill(0);oam.fill(0);hram.fill(0);io.fill(0);
 romBank=1;bankHi=0;ramBank=0;ramOn=false;mbcMode=0;
 io[0x00]=0x30;io[0x40]=0x91;io[0x41]=0x85;io[0x47]=0xFC;io[0x48]=0xFF;io[0x49]=0xFF;
 ch1=mkSq();ch2=mkSq();ch3={en:false,dac:false,len:0,lenEn:false,vs:0,freq:0,timer:0,pos:0};ch4={en:false,dac:false,len:0,lenEn:false,vol:0,iv:0,envUp:false,envP:0,envT:0,timer:8,lfsr:0x7FFF,w7:false,per:8};
 io[0x26]=0x80;io[0x24]=0x77;io[0x25]=0xF3;apuWrite(0x11,0x80);apuWrite(0x12,0xF3);
 fb.fill(0);serial='';
}
function insert(bytes){
 const t=bytes[0x147];
 const types={0:0,1:1,2:1,3:1,5:2,6:2,8:0,9:0,0x0F:3,0x10:3,0x11:3,0x12:3,0x13:3,0x19:5,0x1A:5,0x1B:5,0x1C:5,0x1D:5,0x1E:5};
 if(!(t in types)){info.textContent='Cartouche non prise en charge (type '+t.toString(16)+')';return false;}
cgb=(bytes[0x143]&0x80)!==0;
 mbc=types[t];battery=[3,6,9,0x0F,0x10,0x13,0x1B,0x1E].includes(t);
 let size=1;while(size*0x4000<bytes.length)size<<=1;rom=new Uint8Array(size*0x4000);rom.set(bytes);romMask=size-1;
 const rs=[0,0,1,4,16,8][bytes[0x149]]||0;
 ramUsable=mbc===2||rs>0;ramMask=rs>0?rs-1:0;
 title='';for(let i=0x134;i<(cgb?0x13F:0x144);i++){const c=bytes[i];if(c<32||c>126)break;title+=String.fromCharCode(c);}
 eram.fill(0);
 reset();loaded=true;paused=false;crashed=false;bugCap=null;anomaly='';stall=0;haltBug=0;statLine=false;rewBuf.clear();led.classList.add('on');
 info.textContent=(title||'SANS TITRE')+(cgb?' · COULEUR':'')+(battery?' · PILE':'');
 applyShell();
 return true;
}
function ramSize(){return !ramUsable?0:mbc===2?512:(ramMask+1)*0x2000;}
function saveRam(){if(!battery||!ramDirty||!curId)return;ramDirty=false;dbPut('sram',{id:curId,data:eram.slice(0,ramSize())});}
setInterval(saveRam,4000);
setInterval(()=>{if(loaded&&!paused&&!panelOpen&&!document.hidden)autoSave();},30000);
document.addEventListener('visibilitychange',()=>{if(gba&&G){try{if(document.hidden){G.forceAutoSaveState();G.pauseGame();gbaSync();}else if(!panelOpen&&!paused)G.resumeGame();}catch(e){}}if(document.hidden){saveRam();autoSave();if(AC)AC.suspend().catch(()=>{});}else if(AC)AC.resume().catch(()=>{});});
addEventListener('pagehide',()=>{saveRam();autoSave();});

/* ---------- états (sauvegarde instantanée / retour arrière) ---------- */
function snap(withFb){
 return{cgb,dbl,vbank,wbank,hdmaOn,hdmaSrc,hdmaDst,hdmaLeft,bgPal:bgPal.slice(),obPal:obPal.slice(),A,F,B,C,D,E,H,L,SP,PC,IME,eiP,halted,IE,IF,romBank,bankHi,ramBank,ramOn,mbcMode,divC,timA,LY,mode,ppuC,winLine,fsT,fsStep,smpT,
  vram:vram.slice(),wram:wram.slice(),oam:oam.slice(),io:io.slice(),hram:hram.slice(),eram:ramUsable?eram.slice(0,ramSize()):null,
  ch1:{...ch1},ch2:{...ch2},ch3:{...ch3},ch4:{...ch4},fb:withFb?(cgb?fbc.slice():fb.slice()):null};
}
function restore(s){
 if(s.bgPal){({dbl,vbank,wbank,hdmaOn,hdmaSrc,hdmaDst,hdmaLeft}=s);bgPal.set(s.bgPal);obPal.set(s.obPal);}
 ({A,F,B,C,D,E,H,L,SP,PC,IME,eiP,halted,IE,IF,romBank,bankHi,ramBank,ramOn,mbcMode,divC,timA,LY,mode,ppuC,winLine,fsT,fsStep,smpT}=s);
 vram.set(s.vram);wram.set(s.wram);oam.set(s.oam);io.set(s.io);hram.set(s.hram);if(s.eram)eram.set(s.eram);
 ch1=Object.assign(mkSq(),s.ch1);ch2=Object.assign(mkSq(),s.ch2);ch3={...s.ch3};ch4={...s.ch4};
 if(s.fb){if(s.fb instanceof Uint16Array)fbc.set(s.fb);else fb.set(s.fb);}
}
let rewinding=false,fast=false,frameN=0;
const REW_MAX=200;
const rewBuf={slots:[],head:0,len:0,
 clear(){this.len=0;},
 push(){let sl=this.slots[this.head];
  if(!sl||sl.cgb!==cgb||(sl.eram&&!ramUsable)||(!sl.eram&&ramUsable)||(sl.eram&&sl.eram.length!==ramSize())){sl=this.slots[this.head]=snap(true);}
  else{snapInto(sl);}
  sl.fn=frameN;this.head=(this.head+1)%REW_MAX;if(this.len<REW_MAX)this.len++;},
 oldest(){if(!this.len)return null;return this.slots[(this.head-this.len+REW_MAX)%REW_MAX];},
 pop(){if(!this.len)return null;this.head=(this.head-1+REW_MAX)%REW_MAX;this.len--;return this.slots[this.head];},
 get length(){return this.len;}};
function snapInto(o){
 Object.assign(o,{cgb,dbl,vbank,wbank,hdmaOn,hdmaSrc,hdmaDst,hdmaLeft,A,F,B,C,D,E,H,L,SP,PC,IME,eiP,halted,IE,IF,romBank,bankHi,ramBank,ramOn,mbcMode,divC,timA,LY,mode,ppuC,winLine,fsT,fsStep,smpT});
 o.vram.set(vram);o.wram.set(wram);o.oam.set(oam);o.io.set(io);o.hram.set(hram);if(o.eram)o.eram.set(eram.subarray(0,o.eram.length));
 Object.assign(o.ch1,ch1);Object.assign(o.ch2,ch2);Object.assign(o.ch3,ch3);Object.assign(o.ch4,ch4);o.fb.set(cgb?fbc:fb);o.bgPal.set(bgPal);o.obPal.set(obPal);
}

/* ---------- stockage (IndexedDB) ---------- */
let db=null,curId=null,curName='';
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('neurpocket',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('roms',{keyPath:'id'});d.createObjectStore('states',{keyPath:'key'});d.createObjectStore('sram',{keyPath:'id'});};
 r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>res(null);}catch(e){res(null);}});}
function dbReq(store,mode,fn){return new Promise(res=>{if(!db)return res(null);try{const t=db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q?q.result:null);t.onerror=t.onabort=()=>res(null);}catch(e){res(null);}});}
const dbGet=(st,k)=>dbReq(st,'readonly',s=>s.get(k));
const dbAll=st=>dbReq(st,'readonly',s=>s.getAll());
const dbPut=(st,o)=>dbReq(st,'readwrite',s=>s.put(o));
const dbDel=(st,k)=>dbReq(st,'readwrite',s=>s.delete(k));
function hashRom(u){let h=0x811c9dc5;for(let i=0;i<u.length;i+=1){h^=u[i];h=Math.imul(h,0x01000193);}return(h>>>0).toString(16)+'-'+u.length.toString(16);}
/* ---------- Game Boy Advance : moteur mGBA (MPL 2.0) ---------- */
let gba=false,G=null;
const GBN={d0:'Right',d1:'Left',d2:'Up',d3:'Down',b0:'A',b1:'B',b2:'Select',b3:'Start'};
async function gbaInit(){
 if(G)return G;
 if(!self.crossOriginIsolated)throw new Error('iso');
 const mod=await import('./mgba.js');
 G=await mod.default({canvas:document.getElementById('gcv')});
 await G.FSInit();
 try{G.setCoreSettings({rewindEnable:true,rewindBufferCapacity:600,rewindBufferInterval:1,autoSaveStateEnable:true,restoreAutoSaveStateOnLoad:true,autoSaveStateTimerIntervalSeconds:30});}catch(e){}
 try{G.addCoreCallbacks({saveDataUpdatedCallback:gbaSync,autoSaveStateCapturedCallback:gbaSync});}catch(e){}
 try{G.toggleInput(false);}catch(e){}
 return G;
}
let syncT=null;function gbaSync(){clearTimeout(syncT);syncT=setTimeout(()=>{try{G&&G.FSSync();}catch(e){}},1200);}
function gbaStop(){if(gba&&G){try{G.forceAutoSaveState();}catch(e){}try{G.quitGame();}catch(e){}gbaSync();}gba=false;}
async function startGBA(bytes,id,name){
 saveRam();autoSave();
 info.textContent='Chargement du moteur GBA…';
 try{await gbaInit();}catch(e){info.textContent=e.message==='iso'?'Jeux GBA : ouvre la version installée (GitHub). Ici, seuls les jeux GB/GBC marchent.':'Moteur GBA indisponible ('+(e.message||e)+')';return;}
 gbaStop();loaded=false;
 const path=G.filePaths().gamePath+'/'+id+'.gba';
 try{G.FS.stat(path);}catch(e){G.FS.writeFile(path,bytes);gbaSync();}
 if(!G.loadGame(path)){info.textContent='ROM GBA non reconnue';return;}
 gba=true;loaded=true;cgb=false;curId=id;curName=name||'';title=gbaTitle(bytes);rewBuf.clear();
 try{G.setVolume(sound?100:0);G.setFastForwardMultiplier(fast?2:1);}catch(e){}
 if(paused){paused=false;}
 applyShell();fit();led.classList.add('on');
 const r=await dbGet('roms',id);if(r){r.last=Date.now();dbPut('roms',r);}
 info.textContent=title+' · ADVANCE';
}
async function startRom(bytes,id,name){
 if(isGBA(bytes))return startGBA(bytes,id,name);
 if(gba){gbaStop();}
 saveRam();autoSave();
 if(!insert(bytes))return;
 curId=id;curName=name||title;
 const sr=await dbGet('sram',id);if(sr&&sr.data&&battery)eram.set(new Uint8Array(sr.data).subarray(0,eram.length));
 const r=await dbGet('roms',id);if(r){r.last=Date.now();dbPut('roms',r);}
 const au=await dbGet('states','auto#'+id);
 info.textContent=(title||curName)+(au?' · ETATS > AUTO pour reprendre':'');
}
async function addRom(bytes,fname){
 const id=hashRom(bytes);
 const old=await dbGet('roms',id);
 if(!old){const ok=await dbPut('roms',{id,name:fname,title:romTitle(bytes),size:bytes.length,added:Date.now(),last:Date.now(),data:bytes.slice().buffer});
  if(ok===null&&!db)info.textContent='Stockage indisponible : la ROM ne sera pas gardée';}
 await startRom(bytes,id,fname);
}
function isGBA(u){return u.length>=0xC0&&u[0xB2]===0x96&&(u[3]===0xEA||u[3]===0xEB);}
function gbaTitle(u){let t='';for(let i=0xA0;i<0xAC;i++){const c=u[i];if(c<32||c>126)break;t+=String.fromCharCode(c);}return t.trim()||'SANS TITRE';}
function romTitle(b){if(isGBA(b))return gbaTitle(b);let t='';for(let i=0x134;i<((b[0x143]&0x80)?0x13F:0x144);i++){const c=b[i];if(c<32||c>126)break;t+=String.fromCharCode(c);}return t.trim()||'SANS TITRE';}
const EXP_ARR=['vram','wram','oam','io','hram','eram','bgPal','obPal'];
async function packB64(obj,arrs){
 const head=new TextEncoder().encode(JSON.stringify({...obj,lens:arrs.map(([k,v])=>[k,v.length])}));
 let n=4+head.length;for(const[,v]of arrs)n+=v.length;const buf=new Uint8Array(n);new DataView(buf.buffer).setUint32(0,head.length);buf.set(head,4);let p=4+head.length;for(const[,v]of arrs){buf.set(v,p);p+=v.length;}
 let out=buf;try{out=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());}catch(e){}
 let b='';for(let i=0;i<out.length;i+=0x8000)b+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));return btoa(b);
}
async function exportBug(){
 const st=bugCap.state,meta={},arrs=[];for(const k in st){if(k==='fb')continue;const v=st[k];if(v&&v.buffer&&EXP_ARR.includes(k))arrs.push([k,v]);else meta[k]=v;}
 arrs.push(['ins',bugCap.ins]);
 return packB64({v:2,rom:curId,title:bugCap.title,reason:bugCap.reason,from:bugCap.from,to:bugCap.to,meta},arrs);
}

async function exportState(st){

 let n=4+head.length;for(const[,v]of arrs)n+=v.length;const buf=new Uint8Array(n);new DataView(buf.buffer).setUint32(0,head.length);buf.set(head,4);let p=4+head.length;for(const[,v]of arrs){buf.set(v,p);p+=v.length;}
 let out=buf;try{out=new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());}catch(e){}
 let b='';for(let i=0;i<out.length;i+=0x8000)b+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));

// lecture ZIP minimal (stocké / deflate via DecompressionStream)
async function unzipFirstGB(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf);let p=0;
 while(p+30<u.length&&dv.getUint32(p,true)===0x04034b50){
  const meth=dv.getUint16(p+8,true),cs=dv.getUint32(p+18,true),nl=dv.getUint16(p+26,true),xl=dv.getUint16(p+28,true);
  const name=new TextDecoder().decode(u.subarray(p+30,p+30+nl));const start=p+30+nl+xl;const data=u.subarray(start,start+cs);
  if(/\.(gb|gbc|gba)$/i.test(name)){
   if(meth===0)return data.slice();
   if(meth===8&&'DecompressionStream' in window){const ds=new DecompressionStream('deflate-raw');const out=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(out);}
   throw new Error('zip');
  }
  p=start+cs;
 }
 throw new Error('nogb');
}
